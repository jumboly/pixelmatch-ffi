[project]
name = "pixelmatch-ffi"
version = "0.1.0"
description = "Pixel-level image comparison (mapbox/pixelmatch) via a native Rust/C++ library"
readme = "README.md"
license = "ISC"
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
]

[project.urls]
Repository = "https://github.com/jumboly/pixelmatch-ffi"

[project.optional-dependencies]
pillow = ["pillow>=10"]
numpy = ["numpy>=1.24"]
test = ["pytest>=8", "pillow>=11", "numpy>=2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixelmatch_ffi"]

# ネイティブライブラリを cargo でビルド（または CI でビルド済みのものを取り込み）、
# CPython の ABI に依存しない py3-none-<platform> タグの wheel にする
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# sdist 単体では Rust/C++ ソース（リポジトリ直下）を含められないため作らない。
# ソースからのインストールは Git 直接指定（リポジトリ全体が clone される）で行う
only-include = ["pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
